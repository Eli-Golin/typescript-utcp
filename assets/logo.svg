<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="title desc">
  <title id="title">typescript-utcp</title>
  <desc id="desc">A client wired directly to several tools, with no server in between.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16213e"/></linearGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="38" y1="0" x2="122" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="200" rx="28" fill="url(#bg)"/>
  <g transform="translate(24 20)">
    <rect width="160" height="160" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="38" cy="80" r="30" fill="url(#glow)"/>
    <!-- direct cables: the client talks to each tool itself -->
    <g fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round">
      <path d="M38 80 C 70 80, 80 36, 118 36"/>
      <path d="M38 80 L 122 80"/>
      <path d="M38 80 C 70 80, 80 124, 118 124"/>
    </g>
    <g fill="#e9d5ff" stroke="#a78bfa" stroke-width="3">
      <rect x="116" y="26" width="20" height="20" rx="6"/>
      <rect x="120" y="70" width="20" height="20" rx="6"/>
      <rect x="116" y="114" width="20" height="20" rx="6"/>
    </g>
    <!-- the client -->
    <circle cx="38" cy="80" r="14" fill="#22d3ee"/>
    <circle cx="38" cy="80" r="5.5" fill="#0f172a"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="214" y="90" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">typescript<tspan fill="#22d3ee">·</tspan>utcp</text>
    <text x="216" y="124" font-size="20" fill="#94a3b8">UTCP client libraries, maintained fork</text>
    <g transform="translate(216 140)">
      <rect width="80" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="40" y="21" font-size="16" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="1">fork</text>
    </g>
  </g>
</svg>
